name: Keep GALEO Store awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping GALEO health API
        run: |
          curl --fail --silent --show-error --max-time 25             https://galeo-store.onrender.com/health
          echo
